name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      # Every macOS job builds with Xcode 27, which the app icons need: an older
      # actool drops their light and dark appearances. The xcode-27 image ships
      # it; stop here if it is gone rather than build with another Xcode.
      - name: Select Xcode 27
        working-directory: .
        run: |
          set -euo pipefail
          XCODE=/Applications/Xcode_27.app
          if [ ! -d "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1 || true)
          fi
          if [ -z "$XCODE" ] || [ ! -d "$XCODE" ]; then
            echo "::error::Xcode 27 is not installed on this runner. Installed: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Info.plist pins CFBundleVersion to a fixed build number below upstream's,
      # so the installer would skip this Dialog.app on a Mac that already has an
      # upstream build. The tag's digits (2026.10.06.1522 -> 202610061522) give a
      # build number that is higher than any upstream build and always increases.
      - name: Build Dialog.app (unsigned)
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -euo pipefail
          xcodebuild -project dialog.xcodeproj -scheme "Dialog App Bundle" -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
          build_number="${VERSION//[^0-9]/}"
          [ -n "$build_number" ] || { echo "Run this from a version tag such as v2026.10.06.1522"; exit 1; }
          plist=build/Build/Products/Release/Dialog.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build_number" "$plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist" | grep -qx "$build_number"

      # The Prefs / Run / Logs window ships inside the same package as dialog,
      # so every Mac that gets dialog gets the window with nothing else to deploy.
      - name: Build Managed Notifications Dialog.app (unsigned)
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        working-directory: ManagedNotificationsDialog
        run: |
          set -euo pipefail
          make app VERSION="$VERSION"
          test -x "build/pkg-root/Applications/Utilities/Managed Notifications Dialog.app/Contents/MacOS/ManagedNotificationsDialog"

      - name: Build unsigned package
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -euo pipefail
          root="$PWD/pkg/root"; scripts="$PWD/pkg/scripts"
          rm -rf "$PWD/pkg" artifacts
          mkdir -p "$root/Library/Application Support/Dialog" "$root/Applications/Utilities" "$scripts" artifacts
          cp -R build/Build/Products/Release/Dialog.app "$root/Library/Application Support/Dialog/Dialog.app"
          cp -R "ManagedNotificationsDialog/build/pkg-root/Applications/Utilities/Managed Notifications Dialog.app" \
            "$root/Applications/Utilities/Managed Notifications Dialog.app"
          cat > "$scripts/preinstall" <<'PRE'
          #!/bin/bash
          # Managed Notifications Dialog.app is built for macOS 14 or later.
          minimum=14
          current=$(/usr/bin/sw_vers -productVersion)
          if [ "${current%%.*}" -lt "$minimum" ]; then
            echo "This package requires macOS ${minimum} or later; this Mac runs ${current}." >&2
            exit 1
          fi
          exit 0
          PRE
          cat > "$scripts/postinstall" <<'POST'
          #!/bin/bash
          mkdir -p /usr/local/bin
          ln -sfh "/Library/Application Support/Dialog/Dialog.app/Contents/MacOS/dialogcli" /usr/local/bin/dialog
          # dialog's root log folder belongs to root alone: root:wheel 0755, files 0644.
          # dialog run as a user logs to ~/Library/Logs/Managed Notifications instead.
          # A symlink or anything other than a real folder at either level is refused.
          # Earlier builds made the folder world-writable (1777) and its files 0666: each
          # folder level is made root's before anything inside it is read, so nothing
          # can be swapped in mid-walk, then symlinks, hard-linked files and anything
          # else that is not a plain file are removed and the files reset to 0644.
          logs_parent="/Library/Managed Notifications"
          logs="${logs_parent}/logs"
          logs_ok=1
          for dir in "${logs_parent}" "${logs}"; do
            if [ -L "${dir}" ] || { [ -e "${dir}" ] && [ ! -d "${dir}" ]; }; then
              echo "Refusing ${dir}: it is not a real folder."
              logs_ok=0
              break
            fi
            /bin/mkdir -p -m 755 "${dir}"
            /usr/sbin/chown -h root:wheel "${dir}"
            /bin/chmod -h 755 "${dir}"
          done
          if [ "${logs_ok}" = 1 ]; then
            for depth in 1 2; do
              /usr/bin/find -x "${logs}" -mindepth "${depth}" -maxdepth "${depth}" -type d \
                -exec /usr/sbin/chown -h root:wheel {} + -exec /bin/chmod -h 755 {} +
            done
            /usr/bin/find -x "${logs}" -mindepth 1 -maxdepth 3 \
              \( -type l -o \( -type f -links +1 \) -o \( ! -type f ! -type d \) \) -delete
            /usr/bin/find -x "${logs}" -mindepth 1 -maxdepth 3 -type f \
              -exec /usr/sbin/chown -h root:wheel {} + -exec /bin/chmod -h 644 {} +
          fi
          gui="${3%/}/Applications/Utilities/Managed Notifications Dialog.app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister "$gui" 2>/dev/null || true
          # The window used to ship in its own package. This package now owns the
          # app, so drop that receipt rather than leave two packages claiming it.
          /usr/sbin/pkgutil --pkg-info au.csiro.dialog.gui >/dev/null 2>&1 && \
            /usr/sbin/pkgutil --forget au.csiro.dialog.gui >/dev/null 2>&1
          exit 0
          POST
          chmod 755 "$scripts/preinstall" "$scripts/postinstall"
          # Install the app even over a newer bundle, so a rollback also lands.
          pkgbuild --analyze --root "$root" "$PWD/pkg/component.plist"
          i=0
          while plutil -extract "$i" xml1 -o /dev/null "$PWD/pkg/component.plist" 2>/dev/null; do
            plutil -replace "$i.BundleIsVersionChecked" -bool NO "$PWD/pkg/component.plist"
            plutil -replace "$i.BundleIsRelocatable" -bool NO "$PWD/pkg/component.plist"
            i=$((i + 1))
          done
          pkgbuild --root "$root" --component-plist "$PWD/pkg/component.plist" --scripts "$scripts" \
            --identifier au.csiro.dialogcli --version "$VERSION" \
            --install-location / "artifacts/SwiftDialog-component.pkg"
          productbuild --package "artifacts/SwiftDialog-component.pkg" --identifier au.csiro.dialogcli \
            --version "$VERSION" "artifacts/SwiftDialog-${VERSION}.pkg"
          rm -f artifacts/SwiftDialog-component.pkg
          shasum -a 256 "artifacts/SwiftDialog-${VERSION}.pkg" > "artifacts/SwiftDialog-${VERSION}.pkg.sha256"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: swiftDialog ${{ steps.ver.outputs.VERSION }}
          body: Unsigned package built from this tag. Sign and notarize it with your own Developer ID before deployment.
          files: |
            artifacts/SwiftDialog-${{ steps.ver.outputs.VERSION }}.pkg
            artifacts/SwiftDialog-${{ steps.ver.outputs.VERSION }}.pkg.sha256
