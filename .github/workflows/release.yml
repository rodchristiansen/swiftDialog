name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Info.plist pins CFBundleVersion to a fixed build number below upstream's,
      # so the installer would skip this Dialog.app on a Mac that already has an
      # upstream build. The tag's digits (2026.10.06.1522 -> 202610061522) give a
      # build number that is higher than any upstream build and always increases.
      - name: Build Dialog.app (unsigned)
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -euo pipefail
          xcodebuild -project dialog.xcodeproj -scheme "Dialog App Bundle" -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
          build_number="${VERSION//[^0-9]/}"
          [ -n "$build_number" ] || { echo "Run this from a version tag such as v2026.10.06.1522"; exit 1; }
          plist=build/Build/Products/Release/Dialog.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build_number" "$plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist" | grep -qx "$build_number"

      - name: Build unsigned package
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -euo pipefail
          root="$PWD/pkg/root"; scripts="$PWD/pkg/scripts"
          rm -rf "$PWD/pkg" artifacts
          mkdir -p "$root/Library/Application Support/Dialog" "$scripts" artifacts
          cp -R build/Build/Products/Release/Dialog.app "$root/Library/Application Support/Dialog/Dialog.app"
          cat > "$scripts/postinstall" <<'POST'
          #!/bin/bash
          mkdir -p /usr/local/bin
          ln -sfh "/Library/Application Support/Dialog/Dialog.app/Contents/MacOS/dialogcli" /usr/local/bin/dialog
          logs="/Library/Managed Notifications/logs"
          /usr/bin/install -d -m 1777 -o root -g wheel "$logs"
          /bin/chmod 1777 "$logs"
          /bin/chmod 666 "$logs"/dialog.log* 2>/dev/null || true
          exit 0
          POST
          chmod 755 "$scripts/postinstall"
          # Install the app even over a newer bundle, so a rollback also lands.
          pkgbuild --analyze --root "$root" "$PWD/pkg/component.plist"
          i=0
          while plutil -extract "$i" xml1 -o /dev/null "$PWD/pkg/component.plist" 2>/dev/null; do
            plutil -replace "$i.BundleIsVersionChecked" -bool NO "$PWD/pkg/component.plist"
            plutil -replace "$i.BundleIsRelocatable" -bool NO "$PWD/pkg/component.plist"
            i=$((i + 1))
          done
          pkgbuild --root "$root" --component-plist "$PWD/pkg/component.plist" --scripts "$scripts" \
            --identifier au.csiro.dialogcli --version "$VERSION" \
            --install-location / "artifacts/SwiftDialog-component.pkg"
          productbuild --package "artifacts/SwiftDialog-component.pkg" --identifier au.csiro.dialogcli \
            --version "$VERSION" "artifacts/SwiftDialog-${VERSION}.pkg"
          rm -f artifacts/SwiftDialog-component.pkg
          shasum -a 256 "artifacts/SwiftDialog-${VERSION}.pkg" > "artifacts/SwiftDialog-${VERSION}.pkg.sha256"

      - name: Build Managed Notifications Dialog package (unsigned)
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        working-directory: ManagedNotificationsDialog
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then export DEVELOPER_DIR="$XCODE/Contents/Developer"; fi
          make pkg VERSION="$VERSION"
          cp "build/ManagedNotificationsDialog-${VERSION}.pkg" ../artifacts/
          (cd ../artifacts && shasum -a 256 "ManagedNotificationsDialog-${VERSION}.pkg" > "ManagedNotificationsDialog-${VERSION}.pkg.sha256")

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: swiftDialog ${{ steps.ver.outputs.VERSION }}
          body: Unsigned package built from this tag. Sign and notarize it with your own Developer ID before deployment.
          files: |
            artifacts/SwiftDialog-${{ steps.ver.outputs.VERSION }}.pkg
            artifacts/SwiftDialog-${{ steps.ver.outputs.VERSION }}.pkg.sha256
            artifacts/ManagedNotificationsDialog-${{ steps.ver.outputs.VERSION }}.pkg
            artifacts/ManagedNotificationsDialog-${{ steps.ver.outputs.VERSION }}.pkg.sha256
